<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Mental : Les Puissances</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #16161a;
            --accent-color: #39ff14;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .step-panel {
            display: none;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            background-color: #222227;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .question-box {
            background-color: #1e1e24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
        }

        .math-expr {
            font-size: 28px;
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            margin: 20px 0;
            letter-spacing: 1px;
        }

        .fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            padding: 0 5px;
        }

        .fraction .num {
            display: block;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 2px;
        }

        .fraction .den {
            display: block;
            padding-top: 2px;
        }

        sup {
            font-size: 0.65em;
            font-style: normal;
            line-weight: 1;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start, .btn-submit {
            background-color: var(--accent-color);
            color: #000000;
        }

        .btn-skip {
            background-color: #2c2c2e;
            color: #e5e5ea;
            border: 1px solid #48484a;
        }

        .progress-bar {
            background-color: #2c2c2e;
            border-radius: 4px;
            height: 6px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .indicator {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
        }

        .result-box {
            background: #1e1e24;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            text-align: center;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 15px 0;
        }

        table.bilan {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 14px;
        }

        table.bilan th, table.bilan td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .row-correct { color: var(--accent-color); }
        .row-incorrect { color: #ff453a; }
        .row-skipped { color: #e5e5ea; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Entraînement : Les Puissances</h1>
        <div class="subtitle">Écris tes réponses sous la forme <i>a^n</i> (Ex: 5^3 ou 2^-4)</div>
    </div>

    <!-- ETAPE 1 : LOGIN -->
    <div id="panel-login" class="step-panel" style="display: block;">
        <label for="student-name">Nom et Prénom de l'élève :</label>
        <input type="text" id="student-name" placeholder="Ex: Lucas Petit" autocomplete="off">
        <button class="btn-start" style="width: 100%;" onclick="startQuiz()">Commencer la série</button>
    </div>

    <!-- ETAPE 2 : QUIZ -->
    <div id="panel-quiz" class="step-panel">
        <div class="indicator">Question <span id="current-q">1</span> / 5</div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        
        <div class="question-box">
            <p style="font-size: 14px; color: var(--text-muted); margin: 0;">Simplifie l'expression suivante :</p>
            <div class="math-expr" id="math-expression"></div>
        </div>

        <label for="user-answer">Ta réponse (forme a^n) :</label>
        <input type="text" id="user-answer" placeholder="Ex: 5^4" autocomplete="off">

        <div class="btn-group">
            <button class="btn-skip" onclick="skipQuestion()">Passer ⏭️</button>
            <button class="btn-submit" onclick="submitAnswer()">Valider</button>
        </div>
    </div>

    <!-- ETAPE 3 : BILAN -->
    <div id="panel-results" class="step-panel">
        <div class="result-box">
            <h2>Série terminée !</h2>
            <p>Élève : <span id="res-name" style="font-weight: bold;">...</span></p>
            <div class="score-display" id="res-grade">0 / 5</div>
        </div>

        <table class="bilan">
            <thead>
                <tr>
                    <th>Calcul initial</th>
                    <th>Ta réponse</th>
                    <th>Correction</th>
                </tr>
            </thead>
            <tbody id="bilan-body"></tbody>
        </table>

        <button class="btn-start" style="width: 100%; margin-top: 25px;" onclick="window.location.reload()">Recommencer</button>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let studentName = "";

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions() {
        questions = [];
        const bases = [2, 3, 4, 5, 7, 10];

        // Type 1 : Produit de puissances (a^n * a^m)
        let b1 = bases[getRandomInt(0, bases.length - 1)];
        let n1 = getRandomInt(2, 6);
        let m1 = getRandomInt(2, 6);
        questions.push({
            html: `${b1}<sup>${n1}</sup> &times; ${b1}<sup>${m1}</sup>`,
            rawText: `${b1}^${n1} * ${b1}^${m1}`,
            expected: `${b1}^${n1 + m1}`
        });

        // Type 2 : Quotient de puissances (a^n / a^m)
        let b2 = bases[getRandomInt(0, bases.length - 1)];
        let n2 = getRandomInt(5, 9);
        let m2 = getRandomInt(2, 4);
        questions.push({
            html: `<div class="fraction"><span class="num">${b2}<sup>${n2}</sup></span><span class="den">${b2}<sup>${m2}</sup></span></div>`,
            rawText: `${b2}^${n2} / ${b2}^${m2}`,
            expected: `${b2}^${n2 - m2}`
        });

        // Type 3 : Puissance de puissance ((a^n)^m)
        let b3 = bases[getRandomInt(0, bases.length - 1)];
        let n3 = getRandomInt(2, 4);
        let m3 = getRandomInt(2, 4);
        questions.push({
            html: `(${b3}<sup>${n3}</sup>)<sup>${m3}</sup>`,
            rawText: `(${b3}^${n3})^${m3}`,
            expected: `${b3}^${n3 * m3}`
        });

        // Type 4 : Exposant négatif via quotient (a^n / a^m où m > n)
        let b4 = bases[getRandomInt(0, bases.length - 1)];
        let n4 = getRandomInt(2, 3);
        let m4 = getRandomInt(5, 7);
        questions.push({
            html: `<div class="fraction"><span class="num">${b4}<sup>${n4}</sup></span><span class="den">${b4}<sup>${m4}</sup></span></div>`,
            rawText: `${b4}^${n4} / ${b4}^${m4}`,
            expected: `${b4}^${n4 - m4}`
        });

        // Type 5 : Mélange complexe (a^n * a^m) / a^p
        let b5 = bases[getRandomInt(0, bases.length - 1)];
        let n5 = getRandomInt(2, 4);
        let m5 = getRandomInt(2, 4);
        let p5 = getRandomInt(2, 4);
        questions.push({
            html: `<div class="fraction"><span class="num">${b5}<sup>${n5}</sup> &times; ${b5}<sup>${m5}</sup></span><span class="den">${b5}<sup>${p5}</sup></span></div>`,
            rawText: `(${b5}^${n5} * ${b5}^${m5}) / ${b5}^${p5}`,
            expected: `${b5}^${n5 + m5 - p5}`
        });
    }

    function startQuiz() {
        const inputName = document.getElementById("student-name").value.trim();
        if (!inputName) { alert("Entre ton nom et ton prénom !"); return; }
        studentName = inputName;

        document.getElementById("panel-login").style.display = "none";
        document.getElementById("panel-quiz").style.display = "block";

        generateQuestions();
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) { endQuiz(); return; }
        
        const q = questions[currentIndex];
        document.getElementById("current-q").innerText = currentIndex + 1;
        document.getElementById("math-expression").innerHTML = q.html;
        
        const inputAns = document.getElementById("user-answer");
        inputAns.value = "";
        
        setTimeout(() => inputAns.focus(), 50);
        
        document.getElementById("progress-fill").style.width = (currentIndex / questions.length) * 100 + "%";
    }

    function cleanFormat(str) {
        return str.toLowerCase().replace(/\s+/g, "").replace(/⁻/g, "-");
    }

    function submitAnswer() {
        const q = questions[currentIndex];
        const userAns = document.getElementById("user-answer").value.trim();
        if (!userAns) return;

        q.userAnswer = userAns;
        if (cleanFormat(userAns) === cleanFormat(q.expected)) {
            q.status = "correct";
            score++;
        } else {
            q.status = "incorrect";
        }

        currentIndex++;
        loadQuestion();
    }

    function skipQuestion() {
        const q = questions[currentIndex];
        q.userAnswer = "Passé ⏭️";
        q.status = "skipped";

        currentIndex++;
        loadQuestion();
    }

    function endQuiz() {
        document.getElementById("panel-quiz").style.display = "none";
        document.getElementById("panel-results").style.display = "block";

        document.getElementById("res-name").innerText = studentName;
        document.getElementById("res-grade").innerText = `${score} / ${questions.length}`;

        const tbody = document.getElementById("bilan-body");
        tbody.innerHTML = "";

        questions.forEach(q => {
            const tr = document.createElement("tr");
            if (q.status === "correct") tr.className = "row-correct";
            else if (q.status === "skipped") tr.className = "row-skipped";
            else tr.className = "row-incorrect";

            tr.innerHTML = `
                <td>${q.rawText}</td>
                <td>${q.userAnswer}</td>
                <td><strong>${q.expected}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById("user-answer").addEventListener("keyup", function(e) {
        if (e.key === "Enter") submitAnswer();
    });
</script>
</body>
</html>
